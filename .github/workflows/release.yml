name: Release

# Push a version tag (e.g. v0.1.0) to build installers for both platforms and
# publish them to a GitHub Release. Manual runs are allowed for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload installers

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # always-available runner; the codesign crash is handled by CSC_IDENTITY_AUTO_DISCOVERY=false below (macos-13 was pinned earlier but queues for hours with no free runner)
            platform: mac
          - os: windows-latest # builds the .exe (NSIS) installer
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-builder runs on Node here (not bun) — avoids the bun crash and
      # lets each OS build its own native installer (no cross-compile / Wine).
      - name: Install dependencies
        run: npm install

      # TypeScript is a devDependency, so tsc is present after npm install.
      # This is the only gate runnable without a logged-in claude CLI, and it
      # only fires at tag time, so it does not disturb day-to-day commits.
      - name: Typecheck
        run: npx --no-install tsc --noEmit

      # Release-invariant backstop. Runs only if scripts/preflight.mjs exists;
      # otherwise it is a no-op. If present and it fails, the build fails.
      - name: Preflight (release invariants)
        shell: bash
        run: |
          if [ -f scripts/preflight.mjs ]; then
            node scripts/preflight.mjs
          else
            echo "preflight not present yet — skipping"
          fi

      - name: Build renderer
        run: npm run build:renderer

      # macOS is split into two invocations on purpose. `hdiutil` intermittently
      # cannot detach the temporary DMG volume on the macos-26 runner ("Resource
      # busy") — a known electron-builder / runner-images problem, not ours. It
      # failed three times running on v0.5.3 while the app built fine every time,
      # and took latest-mac.yml down with it, which leaves mac auto-update blind.
      #
      # electron-updater consumes the ZIP + latest-mac.yml and CANNOT update from
      # a DMG. So the DMG is best effort and goes FIRST; the ZIP is required and
      # goes LAST, because whichever invocation runs last owns latest-mac.yml.
      # v0.5.4 shipped with them the other way round and published a
      # latest-mac.yml pointing at the .dmg — a release that cannot self-update.
      #
      # Both pass --arm64 --x64 explicitly: a bare `--mac <target>` overrides the
      # arch list in package.json and silently builds host-arch only, which is how
      # v0.5.4 lost its Intel builds entirely.
      - name: Build & publish DMG (mac, best effort)
        if: matrix.platform == 'mac'
        id: dmg
        continue-on-error: true
        run: npx --no-install electron-builder --mac dmg --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Note a missing DMG
        if: matrix.platform == 'mac' && steps.dmg.outcome == 'failure'
        run: |
          echo "::warning title=No .dmg in this release::hdiutil failed again. The" \
               "zip + latest-mac.yml still publish below, so auto-update works and" \
               "existing installs will update. A fresh mac install uses the .zip."

      - name: Build & publish installer (${{ matrix.platform }})
        id: build
        continue-on-error: true
        run: |
          npx --no-install electron-builder ${{ matrix.platform == 'mac' && '--mac zip --arm64 --x64' || '--win' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1 ships UNSIGNED. Do NOT pass empty CSC_LINK / APPLE_* here: GitHub sets
          # an ABSENT secret to "" (not unset), and electron-builder treats an empty
          # CSC_LINK as a cert path -> resolves to the repo dir -> "<dir> not a file"
          # crash on the mac runner (this broke v0.1.0-v0.1.3). So omit them entirely
          # and just disable signing discovery for a clean unsigned build. When a real
          # Apple Developer ID cert exists, add the signing secrets back WITH non-empty
          # values (see docs/notarization-and-signing.md).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # A retry must FIRST delete the half-uploaded assets from the draft, or
      # electron-builder dies on `422 already_exists` instead of the original
      # error and the retry is useless (learned the hard way re-running v0.5.3).
      # Only this platform's assets are purged — the other matrix job is running
      # in parallel and its files must survive.
      - name: Purge this platform's partial assets before retry
        if: steps.build.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # .mjs, not `node -`: piped stdin is treated as CommonJS and rejects
          # the top-level await below.
          cat > purge-assets.mjs <<'JS'
          const tag = process.env.TAG, plat = process.env.PLATFORM;
          const h = { Authorization: `Bearer ${process.env.GH_TOKEN}`,
                      Accept: "application/vnd.github+json" };
          const api = "https://api.github.com/repos/${{ github.repository }}";
          const rels = await (await fetch(`${api}/releases?per_page=20`, { headers: h })).json();
          const rel = rels.find((r) => r.tag_name === tag);
          if (!rel) { console.log("no release for", tag, "— nothing to purge"); process.exit(0); }
          const mine = (n) => plat === "mac"
            ? /mac|\.dmg/i.test(n)
            : /\.exe|^latest\.yml$/i.test(n);
          for (const a of rel.assets.filter((a) => mine(a.name))) {
            const r = await fetch(`${api}/releases/assets/${a.id}`, { method: "DELETE", headers: h });
            console.log(`delete ${a.name} -> ${r.status}`);
          }
          JS
          node purge-assets.mjs
          rm -f purge-assets.mjs

      - name: Retry build & publish (${{ matrix.platform }})
        if: steps.build.outcome == 'failure'
        run: |
          npx --no-install electron-builder ${{ matrix.platform == 'mac' && '--mac zip --arm64 --x64' || '--win' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
